<section class="auth-page" *transloco="let t">
  <div class="auth-hero">
    <div class="auth-art"><app-login-art /></div>
    <p class="auth-tagline">{{ t('auth.tagline') }}</p>
  </div>

  <div class="auth-body">
    <h1>{{ t('auth.login.title') }}</h1>
    <p class="auth-lead">{{ t('auth.login.lead') }}</p>

    @if (oauthErrorKey; as key) {
      <p class="error" role="alert">{{ t(key) }}</p>
    }

    <button type="button" class="btn-filled" [disabled]="pending()" (click)="loginWithGoogle()">
      {{ pending() ? t('auth.login.pending') : t('auth.login.google') }}
    </button>
  </div>
</section>
