<section class="auth-page">
  <h2>Реєстрація</h2>

  <form novalidate (submit)="$event.preventDefault(); submit()" class="auth-form">
    <div class="form-group">
      <label>Ім'я</label>
      <input [formField]="form.displayName" placeholder="Наприклад: Олена" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [formField]="form.email" />
    </div>

    <div class="form-group">
      <label>Пароль (мін. 8 символів)</label>
      <input type="password" [formField]="form.password" />
    </div>

    @if (errorMessage(); as message) {
      <p class="error">{{ message }}</p>
    }

    <button type="submit" [disabled]="!form().valid() || pending()">
      {{ pending() ? 'Реєстрація...' : 'Зареєструватися' }}
    </button>
  </form>

  <p class="switch-link">Вже маєте акаунт? <a routerLink="/login">Увійти</a></p>
</section>
