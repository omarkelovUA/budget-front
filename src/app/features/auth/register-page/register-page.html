<section class="auth-page">
  <h2>Реєстрація</h2>

  <form novalidate (submit)="$event.preventDefault(); submit()" class="auth-form">
    <div class="form-group">
      <label for="register-displayName">Ім'я</label>
      <input id="register-displayName" [formField]="form.displayName" placeholder="Наприклад: Олена" />
    </div>

    <div class="form-group">
      <label for="register-email">Email</label>
      <input id="register-email" type="email" [formField]="form.email" />
    </div>

    <div class="form-group">
      <label for="register-password">Пароль (мін. 8 символів)</label>
      <input id="register-password" type="password" [formField]="form.password" />
    </div>

    @if (errorMessage(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="submit" [disabled]="!form().valid() || pending()">
      {{ pending() ? 'Реєстрація...' : 'Зареєструватися' }}
    </button>
  </form>

  <p class="switch-link">Вже маєте акаунт? <a routerLink="/login">Увійти</a></p>
</section>
