<section class="auth-page" *transloco="let t">
  <div class="auth-hero">
    <div class="auth-art"><app-register-art /></div>
    <p class="auth-tagline">{{ t('auth.tagline') }}</p>
  </div>

  <div class="auth-body">
    <h1>{{ t('auth.register.title') }}</h1>

    <form novalidate (submit)="$event.preventDefault(); submit()" class="auth-form">
      <div class="field">
        <label for="register-displayName">{{ t('auth.register.displayName') }}</label>
        <input id="register-displayName" [formField]="form.displayName" [placeholder]="t('auth.register.displayNamePlaceholder')" />
      </div>

      <div class="field">
        <label for="register-email">{{ t('auth.email') }}</label>
        <input id="register-email" type="email" [formField]="form.email" />
      </div>

      <div class="field">
        <label for="register-password">{{ t('auth.register.password') }}</label>
        <input id="register-password" type="password" [formField]="form.password" />
      </div>

      @if (errorMessage(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }

      <button type="submit" class="btn-filled" [disabled]="!form().valid() || pending()">
        {{ pending() ? t('auth.register.pending') : t('auth.register.submit') }}
      </button>
    </form>

    <p class="switch-link">{{ t('auth.register.haveAccount') }} <a routerLink="/login">{{ t('auth.register.loginLink') }}</a></p>
  </div>
</section>
