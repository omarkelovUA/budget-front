<form [formGroup]="form" (ngSubmit)="submit()" class="account-form">
  <div class="form-group">
    <label>Назва</label>
    <input formControlName="name" placeholder="Наприклад: Моя картка" />
  </div>

  <div class="form-group">
    <label>Валюта</label>
    <input formControlName="currency" />
  </div>

  <div class="form-group">
    <label>Іконка</label>
    <div class="icon-picker">
      @for (icon of icons; track icon) {
        <label class="icon-option">
          <input type="radio" formControlName="icon" [value]="'assets/' + icon + '.svg'" />
          <span class="icon-swatch">
          <img [src]="'assets/' + icon + '.svg'" [alt]="icon" />
        </span>
        </label>
      }
    </div>
  </div>

  <div class="form-group">
    <label>Колір</label>
    <div class="color-picker">
      @for (color of colors; track color) {
        <label class="color-option">
          <input type="radio" formControlName="color" [value]="color" />
          <span [style.background-color]="color" class="color-swatch"></span>
        </label>
      }
    </div>
  </div>

  <button type="submit" [disabled]="form.invalid">Зберегти</button>
</form>
