<form novalidate (submit)="$event.preventDefault(); submit()" class="account-form">
  <div class="form-group">
    <label>Назва</label>
    <input [formField]="form.name" placeholder="Наприклад: Моя картка" />
  </div>

  <div class="form-group">
    <label>Валюта</label>
    <input [formField]="form.currency" />
  </div>

  <div class="form-group">
    <label>Іконка</label>
    <div class="icon-picker">
      @for (icon of icons; track icon) {
        <label class="icon-option">
          <input type="radio" [formField]="form.icon" [value]="'assets/' + icon + '.svg'" />
          <span class="icon-swatch">
          <img [src]="'assets/' + icon + '.svg'" [alt]="icon" />
        </span>
        </label>
      }
    </div>
  </div>

  <div class="form-group">
    <label>Колір</label>
    <div class="color-picker">
      @for (color of colors; track color) {
        <label class="color-option">
          <input type="radio" [formField]="form.color" [value]="color" />
          <span [style.background-color]="color" class="color-swatch"></span>
        </label>
      }
    </div>
  </div>

  <div class="form-group">
    <label>Доступ</label>
    <div class="visibility-picker">
      @for (visibility of visibilities; track visibility) {
        <label class="visibility-option">
          <input type="radio" [formField]="form.visibility" [value]="visibility" />
          <span class="visibility-label">{{ visibility === 'shared' ? 'Сімейний' : 'Особистий' }}</span>
        </label>
      }
    </div>
  </div>

  <button type="submit" [disabled]="!form().valid()">Зберегти</button>
</form>
