<form novalidate (submit)="$event.preventDefault(); submit()" class="transaction-form">
  <div class="form-group">
    <label>Тип операції</label>
    <div class="kind-picker">
      @for (kind of kinds; track kind) {
        <label class="kind-option">
          <input type="radio" [formField]="form.kind" [value]="kind" />
          <span class="kind-label">{{ kind === 'payment' ? 'Платіж' : 'Переказ' }}</span>
        </label>
      }
    </div>
  </div>

  <div class="form-group">
    <label>Сума</label>
    <input type="number" [formField]="form.amount" step="0.01" />
  </div>

  <div class="form-group">
    <label>Дата</label>
    <input type="date" [formField]="form.date" />
  </div>

  @if (form.kind().value() === 'payment') {
    <div class="form-group">
      <label>Рахунок</label>
      <select [formField]="form.accountId">
        <option value="" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Категорія</label>
      <select [formField]="form.categoryId">
        <option value="" disabled>Оберіть категорію</option>
        @for (cat of categoriesResource.value(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }} ({{ cat.type === 'income' ? 'дохід' : 'витрата' }})</option>
        }
      </select>
    </div>
  } @else {
    <div class="form-group">
      <label>З рахунку</label>
      <select [formField]="form.fromAccountId">
        <option value="" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>На рахунок</label>
      <select [formField]="form.toAccountId">
        <option value="" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>
  }

  <button type="submit" [disabled]="!form().valid()">Зберегти</button>
</form>
