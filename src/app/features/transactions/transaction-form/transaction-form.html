<form [formGroup]="form" (ngSubmit)="submit()" class="transaction-form">
  <div class="form-group">
    <label>Тип операції</label>
    <div class="kind-picker">
      @for (kind of kinds; track kind) {
        <label class="kind-option">
          <input type="radio" formControlName="kind" [value]="kind" />
          <span class="kind-label">{{ kind === 'payment' ? 'Платіж' : 'Переказ' }}</span>
        </label>
      }
    </div>
  </div>

  <div class="form-group">
    <label>Сума</label>
    <input type="number" formControlName="amount" min="0.01" step="0.01" />
  </div>

  <div class="form-group">
    <label>Дата</label>
    <input type="date" formControlName="date" />
  </div>

  @if (form.value.kind === 'payment') {
    <div class="form-group">
      <label>Рахунок</label>
      <select formControlName="accountId">
        <option [ngValue]="null" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [ngValue]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Категорія</label>
      <select formControlName="categoryId">
        <option [ngValue]="null" disabled>Оберіть категорію</option>
        @for (cat of categoriesResource.value(); track cat.id) {
          <option [ngValue]="cat.id">{{ cat.name }} ({{ cat.type === 'income' ? 'дохід' : 'витрата' }})</option>
        }
      </select>
    </div>
  } @else {
    <div class="form-group">
      <label>З рахунку</label>
      <select formControlName="fromAccountId">
        <option [ngValue]="null" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [ngValue]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>На рахунок</label>
      <select formControlName="toAccountId">
        <option [ngValue]="null" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [ngValue]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>
  }

  <button type="submit" [disabled]="form.invalid">Зберегти</button>
</form>
