<form novalidate (submit)="$event.preventDefault(); submit()" class="transaction-form" *transloco="let t">
  <div class="panel-header">
    <app-transaction-form-art />
    <h2>{{ t('transactions.add') }}</h2>
  </div>

  <div class="field">
    <label>{{ t('transactions.form.kind') }}</label>
    <div class="kind-picker" role="radiogroup" [attr.aria-label]="t('transactions.form.kind')">
      @for (kind of kinds; track kind) {
        <label class="kind-option">
          <input type="radio" [formField]="form.kind" [value]="kind" />
          <span class="kind-label">{{ t('transactions.form.kinds.' + kind) }}</span>
        </label>
      }
    </div>
  </div>

  <div class="field">
    <label for="transaction-amount">{{ t('common.amount') }}</label>
    <input id="transaction-amount" type="number" [formField]="form.amount" step="0.01" />
  </div>

  <div class="field">
    <label for="transaction-date">{{ t('common.date') }}</label>
    <input id="transaction-date" type="date" [formField]="form.date" />
  </div>

  @if (form.kind().value() === 'payment') {
    <div class="field">
      <label for="transaction-accountId">{{ t('common.account') }}</label>
      <select id="transaction-accountId" [formField]="form.accountId">
        <option value="" disabled>{{ t('common.chooseAccount') }}</option>
        @for (acc of usableAccounts(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="transaction-categoryId">{{ t('common.category') }}</label>
      <select id="transaction-categoryId" [formField]="form.categoryId">
        <option value="" disabled>{{ t('common.chooseCategory') }}</option>
        @for (cat of categoriesResource.value(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }} ({{ t('common.categoryType.' + cat.type) }})</option>
        }
      </select>
    </div>
  } @else {
    <div class="field">
      <label for="transaction-fromAccountId">{{ t('transactions.form.fromAccount') }}</label>
      <select id="transaction-fromAccountId" [formField]="form.fromAccountId">
        <option value="" disabled>{{ t('common.chooseAccount') }}</option>
        @for (acc of usableAccounts(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="transaction-toAccountId">{{ t('transactions.form.toAccount') }}</label>
      <select id="transaction-toAccountId" [formField]="form.toAccountId">
        <option value="" disabled>{{ t('common.chooseAccount') }}</option>
        @for (acc of usableAccounts(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>
  }

  @if (errorMessage(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <button type="submit" class="btn-filled" [disabled]="!form().valid()">{{ t('common.save') }}</button>
</form>
