<form novalidate (submit)="$event.preventDefault(); submit()" class="transaction-form">
  <div class="form-group">
    <label>Тип операції</label>
    <div class="kind-picker" role="radiogroup" aria-label="Тип операції">
      @for (kind of kinds; track kind) {
        <label class="kind-option">
          <input type="radio" [formField]="form.kind" [value]="kind" />
          <span class="kind-label">{{ kind === 'payment' ? 'Платіж' : 'Переказ' }}</span>
        </label>
      }
    </div>
  </div>

  <div class="form-group">
    <label for="transaction-amount">Сума</label>
    <input id="transaction-amount" type="number" [formField]="form.amount" step="0.01" />
  </div>

  <div class="form-group">
    <label for="transaction-date">Дата</label>
    <input id="transaction-date" type="date" [formField]="form.date" />
  </div>

  @if (form.kind().value() === 'payment') {
    <div class="form-group">
      <label for="transaction-accountId">Рахунок</label>
      <select id="transaction-accountId" [formField]="form.accountId">
        <option value="" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="transaction-categoryId">Категорія</label>
      <select id="transaction-categoryId" [formField]="form.categoryId">
        <option value="" disabled>Оберіть категорію</option>
        @for (cat of categoriesResource.value(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }} ({{ cat.type === 'income' ? 'дохід' : 'витрата' }})</option>
        }
      </select>
    </div>
  } @else {
    <div class="form-group">
      <label for="transaction-fromAccountId">З рахунку</label>
      <select id="transaction-fromAccountId" [formField]="form.fromAccountId">
        <option value="" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="transaction-toAccountId">На рахунок</label>
      <select id="transaction-toAccountId" [formField]="form.toAccountId">
        <option value="" disabled>Оберіть рахунок</option>
        @for (acc of accountsResource.value(); track acc.id) {
          <option [value]="acc.id">{{ acc.name }}</option>
        }
      </select>
    </div>
  }

  @if (errorMessage(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <button type="submit" [disabled]="!form().valid()">Зберегти</button>
</form>
