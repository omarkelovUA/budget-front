<form novalidate (submit)="$event.preventDefault(); submit()" class="budget-form" *transloco="let t">
  <div class="form-group">
    <label for="budget-categoryId">{{ t('budgets.form.category') }}</label>
    <select id="budget-categoryId" [formField]="form.categoryId">
      <option value="" disabled>{{ t('common.chooseCategory') }}</option>
      @for (cat of expenseCategoriesResource.value(); track cat.id) {
        @if (cat.type === 'expense') {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      }
    </select>
  </div>

  <div class="form-group">
    <label for="budget-period">{{ t('budgets.form.period') }}</label>
    <input id="budget-period" type="month" [formField]="form.period" />
  </div>

  <div class="form-group">
    <label for="budget-plannedAmount">{{ t('budgets.form.planned') }}</label>
    <input id="budget-plannedAmount" type="number" [formField]="form.plannedAmount" step="0.01" />
  </div>

  <div class="form-group">
    <label>{{ t('common.access') }}</label>
    <div class="visibility-picker" role="radiogroup" [attr.aria-label]="t('common.access')">
      @for (visibility of visibilities; track visibility) {
        <label class="visibility-option">
          <input type="radio" [formField]="form.visibility" [value]="visibility" />
          <span class="visibility-label">{{ t('common.visibility.' + visibility) }}</span>
        </label>
      }
    </div>
  </div>

  @if (errorMessage(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <button type="submit" [disabled]="!form().valid()">{{ t('common.save') }}</button>
</form>
