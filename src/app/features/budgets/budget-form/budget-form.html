<form novalidate (submit)="$event.preventDefault(); submit()" class="budget-form">
  <div class="form-group">
    <label for="budget-categoryId">Категорія витрат</label>
    <select id="budget-categoryId" [formField]="form.categoryId">
      <option value="" disabled>Оберіть категорію</option>
      @for (cat of expenseCategoriesResource.value(); track cat.id) {
        @if (cat.type === 'expense') {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      }
    </select>
  </div>

  <div class="form-group">
    <label for="budget-period">Місяць (РРРР-ММ)</label>
    <input id="budget-period" type="month" [formField]="form.period" />
  </div>

  <div class="form-group">
    <label for="budget-plannedAmount">Плановий бюджет</label>
    <input id="budget-plannedAmount" type="number" [formField]="form.plannedAmount" step="0.01" />
  </div>

  <div class="form-group">
    <label>Доступ</label>
    <div class="visibility-picker" role="radiogroup" aria-label="Доступ">
      @for (visibility of visibilities; track visibility) {
        <label class="visibility-option">
          <input type="radio" [formField]="form.visibility" [value]="visibility" />
          <span class="visibility-label">{{ visibility === 'shared' ? 'Сімейний' : 'Особистий' }}</span>
        </label>
      }
    </div>
  </div>

  @if (errorMessage(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <button type="submit" [disabled]="!form().valid()">Зберегти</button>
</form>
