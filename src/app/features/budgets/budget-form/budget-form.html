<form novalidate (submit)="$event.preventDefault(); submit()" class="budget-form">
  <div class="form-group">
    <label>Категорія витрат</label>
    <select [formField]="form.categoryId">
      <option value="" disabled>Оберіть категорію</option>
      @for (cat of expenseCategoriesResource.value(); track cat.id) {
        @if (cat.type === 'expense') {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      }
    </select>
  </div>

  <div class="form-group">
    <label>Місяць (РРРР-ММ)</label>
    <input type="month" [formField]="form.period" />
  </div>

  <div class="form-group">
    <label>Плановий бюджет</label>
    <input type="number" [formField]="form.plannedAmount" step="0.01" />
  </div>

  <div class="form-group">
    <label>Доступ</label>
    <div class="visibility-picker">
      @for (visibility of visibilities; track visibility) {
        <label class="visibility-option">
          <input type="radio" [formField]="form.visibility" [value]="visibility" />
          <span class="visibility-label">{{ visibility === 'shared' ? 'Сімейний' : 'Особистий' }}</span>
        </label>
      }
    </div>
  </div>

  <button type="submit" [disabled]="!form().valid()">Зберегти</button>
</form>
