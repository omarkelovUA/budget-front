<form [formGroup]="form" (ngSubmit)="submit()" class="budget-form">
  <div class="form-group">
    <label>Категорія витрат</label>
    <select formControlName="categoryId">
      <option [ngValue]="null" disabled>Оберіть категорію</option>
      @for (cat of expenseCategoriesResource.value(); track cat.id) {
        @if (cat.type === 'expense') {
          <option [ngValue]="cat.id">{{ cat.name }}</option>
        }
      }
    </select>
  </div>

  <div class="form-group">
    <label>Місяць (РРРР-ММ)</label>
    <input type="month" formControlName="period" />
  </div>

  <div class="form-group">
    <label>Плановий бюджет</label>
    <input type="number" formControlName="plannedAmount" min="0.01" step="0.01" />
  </div>

  <div class="form-group">
    <label>Доступ</label>
    <div class="visibility-picker">
      @for (visibility of visibilities; track visibility) {
        <label class="visibility-option">
          <input type="radio" formControlName="visibility" [value]="visibility" />
          <span class="visibility-label">{{ visibility === 'shared' ? 'Сімейний' : 'Особистий' }}</span>
        </label>
      }
    </div>
  </div>

  <button type="submit" [disabled]="form.invalid">Зберегти</button>
</form>
