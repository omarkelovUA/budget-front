<form novalidate (submit)="$event.preventDefault(); submit()" class="category-form" *transloco="let t">
  <div class="panel-header">
    <app-category-form-art />
    <h2>{{ category()?.name ?? t('categories.add') }}</h2>
  </div>

  <div class="field">
    <label for="category-name">{{ t('common.name') }}</label>
    <input id="category-name" [formField]="form.name" [placeholder]="t('categories.form.namePlaceholder')" />
  </div>

  <div class="field">
    <label>{{ t('common.type') }}</label>
    <div class="type-picker" role="radiogroup" [attr.aria-label]="t('common.type')">
      @for (type of types; track type) {
        <label class="type-option">
          <input type="radio" [formField]="form.type" [value]="type" />
          <span class="type-label">{{ t('common.categoryType.' + type) }}</span>
        </label>
      }
    </div>
  </div>

  <div class="field">
    <label>{{ t('common.icon') }}</label>
    <app-icon-picker [formField]="form.icon" [icons]="icons" [label]="t('common.icon')" />
  </div>

  <div class="field">
    <label>{{ t('common.color') }}</label>
    <div class="color-picker" role="radiogroup" [attr.aria-label]="t('common.color')">
      @for (color of colors; track color) {
        <label class="color-option">
          <input type="radio" [formField]="form.color" [value]="color" [attr.aria-label]="color" />
          <span [style.background-color]="color" class="color-swatch"></span>
        </label>
      }
    </div>
  </div>

  <div class="field">
    <label>{{ t('common.access') }}</label>
    <div class="visibility-picker" role="radiogroup" [attr.aria-label]="t('common.access')">
      @for (visibility of visibilities; track visibility) {
        <label class="visibility-option">
          <input type="radio" [formField]="form.visibility" [value]="visibility" />
          <span class="visibility-label">{{ t('common.visibility.' + visibility) }}</span>
        </label>
      }
    </div>
  </div>

  @if (errorMessage(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <button type="submit" class="btn-filled" [disabled]="!form().valid()">{{ t('common.save') }}</button>
</form>
